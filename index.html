<!DOCTYPE html>
<html>
<head>
  <title>NoBroker Loans</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input { padding: 10px; width: 300px; }
    .card { border: 1px solid #ccc; margin: 10px 0; padding: 10px; }
  </style>
</head>

<body>

<h1>NoBroker Loans</h1>

<input id="search" placeholder="Search bank...">

<div id="catalog"></div>

<script>

let DATA = [];

/* ===== FETCH DATA ===== */
async function loadData() {

  const API = "PASTE_YOUR_API_URL_HERE";

  const res = await fetch(API);
  const data = await res.json();

  DATA = data;

  render(DATA);
}

loadData();

/* ===== RENDER ===== */
function render(data) {
  document.getElementById("catalog").innerHTML = data.map(d => `
    <div class="card">
      <h3>${d.name}</h3>
      <p>${d.code}</p>
      <p>${d.city}</p>
    </div>
  `).join("");
}

/* ===== SEARCH ===== */
document.getElementById("search").addEventListener("input", (e) => {

  const q = e.target.value.toLowerCase();

  const filtered = DATA.filter(d =>
    (d.name || "").toLowerCase().includes(q) ||
    (d.code || "").toLowerCase().includes(q)
  );

  render(filtered);
});

</script>

</body>
</html>
